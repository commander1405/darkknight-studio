<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support — DARKKNIGHT STUDIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="section container">
    <h2 data-i18n="sections.support"></h2>
    <form class="form" id="ticket-form" style="margin-top:1.25rem">
      <label><span data-i18n="sections.name"></span><input name="name" required maxlength="80" /></label>
      <label><span data-i18n="sections.email"></span><input name="contact" required maxlength="120" /></label>
      <label><span data-i18n="sections.subject"></span><input name="subject" required maxlength="120" /></label>
      <label><span data-i18n="sections.message"></span><textarea name="message" required maxlength="4000"></textarea></label>
      <button class="btn btn-primary" type="submit" data-i18n="sections.submit"></button>
    </form>
    <hr style="border:0;border-top:1px solid var(--border);margin:2rem 0" />
    <form class="form" id="check-form">
      <label><span data-i18n="sections.ticketRef"></span><input name="ref" required maxlength="32" /></label>
      <label><span data-i18n="sections.email"></span><input name="contact" required maxlength="120" /></label>
      <button class="btn btn-ghost" type="submit" data-i18n="sections.checkTicket"></button>
      <div id="ticket-result" class="empty" style="display:none"></div>
    </form>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module">
    import { renderShell } from "./assets/js/layout.js";
    import { getSupabase, isConfigured } from "./assets/js/supabase-client.js";
    import { t, applyI18n } from "./assets/js/i18n.js";
    import { toast, escapeHtml } from "./assets/js/utils.js";
    renderShell("support.html");
    applyI18n();

    document.getElementById("ticket-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!isConfigured()) return toast(t("sections.notConfigured"), "err");
      const fd = new FormData(e.target);
      const sb = await getSupabase();
      const { data, error } = await sb.rpc("create_support_ticket", {
        p_name: String(fd.get("name")||"").trim(),
        p_contact: String(fd.get("contact")||"").trim(),
        p_subject: String(fd.get("subject")||"").trim(),
        p_message: String(fd.get("message")||"").trim(),
      });
      if (error) return toast(error.message || t("sections.error"), "err");
      toast(t("sections.success") + " — " + (data?.reference || data || ""), "ok");
      e.target.reset();
    };

    document.getElementById("check-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!isConfigured()) return toast(t("sections.notConfigured"), "err");
      const fd = new FormData(e.target);
      const sb = await getSupabase();
      const { data, error } = await sb.rpc("lookup_support_ticket", {
        p_reference: String(fd.get("ref")||"").trim(),
        p_contact: String(fd.get("contact")||"").trim(),
      });
      const box = document.getElementById("ticket-result");
      box.style.display = "block";
      if (error || !data) {
        box.textContent = t("sections.error");
        return;
      }
      box.innerHTML = `<strong>${escapeHtml(data.subject||"")}</strong><br/>${t("sections.status")}: ${escapeHtml(data.status||"")}`;
    };
  </script>
</body>
</html>
