<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — DARKKNIGHT STUDIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="section container">
    <h2 data-i18n="sections.contact"></h2>
    <form class="form" id="contact-form" style="margin-top:1.25rem">
      <label><span data-i18n="sections.name"></span><input name="name" required maxlength="80" /></label>
      <label><span data-i18n="sections.email"></span><input name="contact" required maxlength="120" /></label>
      <label><span data-i18n="sections.subject"></span><input name="subject" required maxlength="120" /></label>
      <label><span data-i18n="sections.message"></span><textarea name="message" required maxlength="4000"></textarea></label>
      <button class="btn btn-primary" type="submit" data-i18n="sections.submit"></button>
    </form>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module">
    import { renderShell } from "./assets/js/layout.js";
    import { getSupabase, isConfigured } from "./assets/js/supabase-client.js";
    import { t, applyI18n } from "./assets/js/i18n.js";
    import { toast } from "./assets/js/utils.js";
    renderShell("contact.html");
    applyI18n();
    document.getElementById("contact-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!isConfigured()) return toast(t("sections.notConfigured"), "err");
      const fd = new FormData(e.target);
      const payload = {
        name: String(fd.get("name")||"").trim(),
        contact: String(fd.get("contact")||"").trim(),
        subject: String(fd.get("subject")||"").trim(),
        message: String(fd.get("message")||"").trim(),
      };
      if (payload.message.length < 5) return toast(t("sections.error"), "err");
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      try {
        const sb = await getSupabase();
        const { error } = await sb.from("contact_messages").insert(payload);
        if (error) throw error;
        toast(t("sections.success"), "ok");
        e.target.reset();
      } catch {
        toast(t("sections.error"), "err");
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
